name: Build Orville Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q orville-v3-real-forge-source-alpha1.zip -d extracted

      - name: Build mod
        working-directory: extracted/orville_v3_real
        run: gradle build --stacktrace

      - name: Upload finished JAR
        uses: actions/upload-artifact@v4
        with:
          name: orville-mod-1.20.1
          path: extracted/orville_v3_real/build/libs/*.jar
